<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="LeaveSafe — leave your laptop, stay safe. The panel shifts from standby to armed and raises an alert.">
  <title>LeaveSafe — leave your laptop, stay safe</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1019"/>
      <stop offset="1" stop-color="#06080e"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#c8d4ff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ea0ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8ea0ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8ea0ff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6c7cff" stop-opacity=".38">
        <animate attributeName="stop-color"
                 values="#6c7cff;#6c7cff;#ff4d3d;#ff4d3d;#ff4d3d;#6c7cff"
                 keyTimes="0;0.30;0.40;0.70;0.92;1" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#6c7cff" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="250" cy="150" rx="520" ry="300" fill="url(#halo)"/>

    <!-- scanning sweep -->
    <rect x="-320" y="0" width="320" height="320" fill="url(#sweep)">
      <animate attributeName="x" values="-320;1200" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- ── wordmark ─────────────────────────────────────────────── -->
    <text x="64" y="118" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
          font-size="62" font-weight="700" letter-spacing="-1.5" fill="#eef2fb">Leave<tspan fill="#6c7cff">Safe<animate
      attributeName="fill" values="#6c7cff;#6c7cff;#ff4d3d;#ff4d3d;#6c7cff"
      keyTimes="0;0.30;0.40;0.92;1" dur="11s" repeatCount="indefinite"/></tspan></text>

    <text x="66" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="13" letter-spacing="4.4" fill="#7b879c">LEAVE YOUR LAPTOP. STAY SAFE.</text>

    <!-- ── state readout ────────────────────────────────────────── -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="2.6">
      <g opacity="1">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.28;0.36;0.96;1"
                 dur="11s" repeatCount="indefinite"/>
        <circle cx="72" cy="209" r="5" fill="#6c7cff"/>
        <text x="90" y="215" fill="#aeb9cd">STANDBY · 6 SENSORS READY</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0;1;1;0" keyTimes="0;0.36;0.42;0.66;0.70;0.88;0.92;0.96;1"
                 dur="11s" repeatCount="indefinite"/>
        <circle cx="72" cy="209" r="5" fill="#ff4d3d"/>
        <text x="90" y="215" fill="#f0b6ae">ARMED · WATCHING 6 SENSORS</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70;0.74;0.86;0.90;1"
                 dur="11s" repeatCount="indefinite"/>
        <circle cx="72" cy="209" r="5" fill="#ff4d3d">
          <animate attributeName="opacity" values="1;.15;1" dur="0.7s" repeatCount="indefinite"/>
        </circle>
        <text x="90" y="215" fill="#ff6b5c" font-weight="700">ALERT · CHARGER DISCONNECTED</text>
      </g>
    </g>

    <!-- ── trace line ───────────────────────────────────────────── -->
    <path d="M64 258h420" stroke="#6c7cff" stroke-opacity=".55" stroke-width="1.6" fill="none">
      <animate attributeName="stroke" values="#6c7cff;#6c7cff;#ff4d3d;#ff4d3d;#6c7cff"
               keyTimes="0;0.30;0.40;0.92;1" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M64 258h180l7-13 6 24 7-11h226" stroke="#ff4d3d" stroke-width="1.8" fill="none" opacity="0"
          stroke-linejoin="round">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70;0.73;0.84;0.88;1"
               dur="11s" repeatCount="indefinite"/>
    </path>

    <!-- ── annunciator ──────────────────────────────────────────── -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <!-- row 1 -->
      <g>
        <rect x="640" y="62" width="164" height="82" rx="12" fill="#121826" stroke="#6c7cff" stroke-opacity=".30" stroke-width="1.4">
          <animate attributeName="stroke" values="#6c7cff;#6c7cff;#ff4d3d;#ff4d3d;#6c7cff"
                   keyTimes="0;0.30;0.40;0.92;1" dur="11s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#121826;#121826;#1a1113;#3a1512;#1a1113;#121826"
                   keyTimes="0;0.68;0.72;0.78;0.86;1" dur="11s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values=".3;.3;.85;.85;.3;.3" keyTimes="0;0.68;0.74;0.86;0.92;1"
                   dur="11s" repeatCount="indefinite"/>
        </rect>
        <text x="660" y="96" font-size="14" letter-spacing="1.6" font-weight="700" fill="#dbe3f2">POWER</text>
        <text x="660" y="122" font-size="11.5" letter-spacing="2" fill="#6c7789">READY<animate
          attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.70;0.73;0.85;0.89;1"
          dur="11s" repeatCount="indefinite"/></text>
        <text x="660" y="122" font-size="11.5" letter-spacing="2" font-weight="700" fill="#ff6b5c" opacity="0">TRIPPED
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70;0.73;0.85;0.89;1"
                   dur="11s" repeatCount="indefinite"/>
        </text>
      </g>

      <g>
        <rect x="818" y="62" width="164" height="82" rx="12" fill="#121826" stroke="#6c7cff" stroke-opacity=".30" stroke-width="1.4">
          <animate attributeName="stroke" values="#6c7cff;#6c7cff;#ff4d3d;#ff4d3d;#6c7cff"
                   keyTimes="0;0.30;0.40;0.92;1" dur="11s" repeatCount="indefinite"/>
        </rect>
        <text x="838" y="96" font-size="14" letter-spacing="1.6" font-weight="700" fill="#dbe3f2">LID</text>
        <text x="838" y="122" font-size="11.5" letter-spacing="2" fill="#6c7789">READY</text>
      </g>

      <g>
        <rect x="996" y="62" width="164" height="82" rx="12" fill="#121826" stroke="#6c7cff" stroke-opacity=".30" stroke-width="1.4">
          <animate attributeName="stroke" values="#6c7cff;#6c7cff;#ff4d3d;#ff4d3d;#6c7cff"
                   keyTimes="0;0.30;0.40;0.92;1" dur="11s" repeatCount="indefinite"/>
        </rect>
        <text x="1016" y="96" font-size="14" letter-spacing="1.6" font-weight="700" fill="#dbe3f2">USB</text>
        <text x="1016" y="122" font-size="11.5" letter-spacing="2" fill="#6c7789">READY</text>
      </g>

      <!-- row 2 -->
      <g>
        <rect x="640" y="160" width="164" height="82" rx="12" fill="#121826" stroke="#6c7cff" stroke-opacity=".30" stroke-width="1.4">
          <animate attributeName="stroke" values="#6c7cff;#6c7cff;#ff4d3d;#ff4d3d;#6c7cff"
                   keyTimes="0;0.30;0.40;0.92;1" dur="11s" repeatCount="indefinite"/>
        </rect>
        <text x="660" y="194" font-size="14" letter-spacing="1.6" font-weight="700" fill="#dbe3f2">SCREEN</text>
        <text x="660" y="220" font-size="11.5" letter-spacing="2" fill="#6c7789">READY</text>
      </g>

      <g>
        <rect x="818" y="160" width="164" height="82" rx="12" fill="#121826" stroke="#6c7cff" stroke-opacity=".30" stroke-width="1.4">
          <animate attributeName="stroke" values="#6c7cff;#6c7cff;#ff4d3d;#ff4d3d;#6c7cff"
                   keyTimes="0;0.30;0.40;0.92;1" dur="11s" repeatCount="indefinite"/>
        </rect>
        <text x="838" y="194" font-size="14" letter-spacing="1.6" font-weight="700" fill="#dbe3f2">NETWORK</text>
        <text x="838" y="220" font-size="11.5" letter-spacing="2" fill="#6c7789">READY</text>
      </g>

      <g>
        <rect x="996" y="160" width="164" height="82" rx="12" fill="#121826" stroke="#6c7cff" stroke-opacity=".30" stroke-width="1.4">
          <animate attributeName="stroke" values="#6c7cff;#6c7cff;#ff4d3d;#ff4d3d;#6c7cff"
                   keyTimes="0;0.30;0.40;0.92;1" dur="11s" repeatCount="indefinite"/>
        </rect>
        <text x="1016" y="194" font-size="14" letter-spacing="1.6" font-weight="700" fill="#dbe3f2">INPUT</text>
        <text x="1016" y="220" font-size="11.5" letter-spacing="2" fill="#6c7789">READY</text>
      </g>
    </g>

    <text x="640" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="11.5" letter-spacing="2.6" fill="#4d5769">NO CLOUD · NO ACCOUNTS · ONE QR SCAN</text>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#8ea0ff" stroke-opacity=".14"/>
  </g>
</svg>
