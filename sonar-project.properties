# SonarQube Cloud reads this when the `sonar` job in ci.yml runs the scanner.
#
# The key and the organization are the ones SonarQube derives itself when a
# project is imported from GitHub. If the analysis ever lands under a different
# name, take the real values from the project's Information page rather than
# guessing — a wrong key silently creates a second, empty project.
sonar.projectKey=atakankizilyuce_LeaveSafe
sonar.organization=atakankizilyuce

# Go coverage is not produced here. The Linux leg of the test matrix already
# writes coverage.out, and the sonar job downloads that artifact into the
# workspace before scanning, so this path is relative to the repository root.
sonar.go.coverage.reportPaths=coverage.out

# The phone interface's coverage comes from vitest in the frontend job, is
# rewritten there to name files from the repository root, and is downloaded into
# this path the same way the Go profile is. The landing page's demonstration is
# tested the same way and reports beside it; the two never name the same file,
# so there is no question here of one overwriting the other.
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,site/coverage/lcov.info

# Sources and tests both start from the root and are separated by extension.
# Listing the same directory in both is only safe because the exclusions below
# and the test inclusions here never overlap; without that the scanner refuses
# to index a file twice.
#
# Everything under test/ is test code even though most of it is not named
# *_test.go: the sandbox VM helpers, the real-trigger helpers and the harness
# are the tests. They run inside a QEMU guest or an elevated shell rather than
# under `go test ./...`, so no coverage for them is ever reported — and demanding
# some would be asking for a test of a test.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,test/**,web/test/**,site/test/**,web/src/**/*.test.ts,web/src/**/*.spec.ts

# web/dist is committed build output rather than something anyone writes, and
# testdata holds fixtures that are deliberately malformed. Analysing either one
# reports problems nobody can act on.
#
# coverage.html arrives in the workspace alongside coverage.out, from the same
# artifact. It is `go tool cover -html` output: a generated page that embeds the
# whole source tree, so the scanner reads it as ~600 lines of duplicated code
# plus accessibility defects in markup nobody wrote. Left in, it fails the
# quality gate on its own.
sonar.exclusions=**/*_test.go,test/**,web/test/**,site/test/**,coverage.html,web/dist/**,site/node_modules/**,docs/assets/**,packaging/**,**/testdata/**

# site/intro.js paints the landing page's opening mark onto a canvas and reads
# the scroll. jsdom has neither a 2d context nor a viewport that scrolls, so a
# test of it could assert nothing beyond "it did not throw" — a number that
# would read as coverage without being any. The arithmetic it stands on was
# split out into site/ascii-mark.js precisely so that it could be tested, and
# that file is covered to the line.
#
# cmd/leavesafe/entry.go is func main and nothing else. No test can reach it:
# main is what the operating system calls, and it ends by serving until the
# program is killed, so a test that called it would never return to assert
# anything. Every decision it used to make was moved out to somewhere that can
# be tested — planTerminal, loadConfig, chooseConnectionMode, startApp — and the
# wiring that is left is what the e2e job exercises by starting the real binary
# on all three platforms.
#
# cmd/leavesafe/win32_windows.go is three calls into two Windows DLLs and
# cmd/leavesafe/signals_unix.go is one raise of SIGTSTP, with no branch in any
# of them. A test of the Windows ones could assert nothing beyond "it did not
# throw", and the one that maximizes a window would maximize the window of
# whoever ran the tests — the very behaviour the change they serve was made to
# stop. The signal one is worse than untestable: letting it run would suspend
# the test binary, so the test would not fail, it would hang until something
# killed it.
#
# internal/audio/device_windows.go is winmm against a real sound card. The
# machines that run this suite have none, so waveOutOpen fails at the first line
# and every line after it is unreachable; on a machine that does have one, the
# test would play a siren at full volume at whoever ran it. What can be decided
# rather than called is decided elsewhere and is covered to the line: the
# waveform is arithmetic in siren.go, the byte layout is pcmBytes in play.go,
# and what happens when this file returns an error is in the alarm.
#
# All of them exist as files of their own so that what calls them, and in what
# order, could be covered — console_windows.go, suspend_unix.go and play.go,
# which are.
#
# Excluded from coverage only, not from analysis: every rule still reads these,
# and a bug or a vulnerability in one still fails this gate.
sonar.coverage.exclusions=site/intro.js,cmd/leavesafe/entry.go,cmd/leavesafe/win32_windows.go,cmd/leavesafe/signals_unix.go,internal/audio/device_windows.go

sonar.sourceEncoding=UTF-8
