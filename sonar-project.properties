# SonarQube Cloud reads this when the `sonar` job in ci.yml runs the scanner.
#
# The key and the organization are the ones SonarQube derives itself when a
# project is imported from GitHub. If the analysis ever lands under a different
# name, take the real values from the project's Information page rather than
# guessing — a wrong key silently creates a second, empty project.
sonar.projectKey=atakankizilyuce_LeaveSafe
sonar.organization=atakankizilyuce

# Go coverage is not produced here. The Linux leg of the test matrix already
# writes coverage.out, and the sonar job downloads that artifact into the
# workspace before scanning, so this path is relative to the repository root.
sonar.go.coverage.reportPaths=coverage.out

# The phone interface's coverage comes from vitest in the frontend job, is
# rewritten there to name files from the repository root, and is downloaded into
# this path the same way the Go profile is.
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# Sources and tests both start from the root and are separated by extension.
# Listing the same directory in both is only safe because the exclusions below
# and the test inclusions here never overlap; without that the scanner refuses
# to index a file twice.
#
# Everything under test/ is test code even though most of it is not named
# *_test.go: the sandbox VM helpers, the real-trigger helpers and the harness
# are the tests. They run inside a QEMU guest or an elevated shell rather than
# under `go test ./...`, so no coverage for them is ever reported — and demanding
# some would be asking for a test of a test.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,test/**,web/test/**,web/src/**/*.test.ts,web/src/**/*.spec.ts

# web/dist is committed build output rather than something anyone writes, and
# testdata holds fixtures that are deliberately malformed. Analysing either one
# reports problems nobody can act on.
#
# coverage.html arrives in the workspace alongside coverage.out, from the same
# artifact. It is `go tool cover -html` output: a generated page that embeds the
# whole source tree, so the scanner reads it as ~600 lines of duplicated code
# plus accessibility defects in markup nobody wrote. Left in, it fails the
# quality gate on its own.
sonar.exclusions=**/*_test.go,test/**,web/test/**,coverage.html,web/dist/**,docs/assets/**,packaging/**,**/testdata/**

sonar.sourceEncoding=UTF-8
