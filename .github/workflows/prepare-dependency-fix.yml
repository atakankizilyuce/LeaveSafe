name: Prepare dependency security fix
on:
  pull_request:
    paths:
      - .github/workflows/prepare-dependency-fix.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Resolve compatible security fixes
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix site ci --ignore-scripts
          npm --prefix web update vite vitest @vitest/coverage-v8 undici --ignore-scripts
          npm --prefix web install --save-dev 'vitest@^5.0.3' '@vitest/coverage-v8@^5.0.3' --ignore-scripts
          npm --prefix web audit
          npm --prefix site update vitest @vitest/coverage-v8 undici --ignore-scripts
          npm --prefix site install --save-dev 'vitest@^4.1.12' '@vitest/coverage-v8@^4.1.12' --ignore-scripts
          npm --prefix site audit
      - name: Rebuild committed browser assets
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix site ci --ignore-scripts
          npm --prefix web run typecheck
          npm --prefix web run coverage
          npm --prefix site run coverage
          npm --prefix web run build
      - name: Export generated changes for review
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(["git", "diff", "--name-only", "--", "web/package.json", "web/package-lock.json", "site/package.json", "site/package-lock.json", "web/dist"]).decode().splitlines()
          paths += subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "--", "web/dist"]).decode().splitlines()
          entries = []
          for name in sorted(set(paths)):
              path = pathlib.Path(name)
              entries.append({"path": name, "mode": "100644", "type": "blob", **({"content": path.read_text(encoding="utf-8")} if path.exists() else {"sha": None})})
          payload = json.dumps(entries, ensure_ascii=True, separators=(",", ":"))
          print("FIXSHA " + hashlib.sha256(payload.encode()).hexdigest())
          for start in range(0, len(payload), 6000):
              print("FIXDATA " + payload[start:start+6000])
