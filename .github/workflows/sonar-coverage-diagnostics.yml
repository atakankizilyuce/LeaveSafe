name: Inspect Sonar coverage
on:
  push:
    branches: [codex/sonar-coverage-diagnostics-20261028]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read PR coverage and issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const headers = {Authorization: 'Bearer ' + process.env.SONAR_TOKEN};
          async function get(api, params) {
            const url = new URL('https://sonarcloud.io/api/' + api);
            url.search = new URLSearchParams(params);
            const response = await fetch(url, {headers, signal: AbortSignal.timeout(30000)});
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          }
          const data = await get('measures/component_tree', {
            component: 'atakankizilyuce_LeaveSafe', pullRequest: '154', qualifiers: 'FIL',
            metricKeys: 'new_lines_to_cover,new_uncovered_lines,new_conditions_to_cover,new_uncovered_conditions,new_coverage',
            ps: '500',
          });
          for (const file of data.components) {
            const lines = file.measures.find(m => m.metric === 'new_lines_to_cover');
            if (Number(lines?.period?.value ?? lines?.periods?.[0]?.value ?? 0) > 0) {
              console.log('COVERAGE=' + JSON.stringify(file));
              console.log('SOURCE=' + JSON.stringify({path: file.path, data: await get('sources/lines', {key: file.key, pullRequest: '154', from: '1', to: '2000'})}));
            }
          }
          const issues = await get('issues/search', {componentKeys: 'atakankizilyuce_LeaveSafe', pullRequest: '154', issueStatuses: 'OPEN,CONFIRMED,ACCEPTED', ps: '500'});
          console.log('ISSUES=' + JSON.stringify(issues));
          NODE
