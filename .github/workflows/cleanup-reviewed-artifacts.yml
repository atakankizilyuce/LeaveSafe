name: Clean previously reviewed artifacts
on:
  push:
    branches: [codex/cleanup-reviewed-artifacts-20261026]
    paths:
      - .github/workflows/cleanup-reviewed-artifacts.yml
      - tools/reviewed-cleanup/**
permissions:
  contents: read
concurrency:
  group: reviewed-artifact-cleanup-20261026
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate the reviewed plan without deletion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/reviewed-cleanup/cleanup.py
      - name: Delete the reviewed artifacts and verify absence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/reviewed-cleanup/cleanup.py --apply
