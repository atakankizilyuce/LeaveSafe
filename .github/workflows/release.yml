name: Release

on:
  push:
    tags:
      - "v*"
  # A rehearsal, on any branch, of everything except publishing. Signing,
  # checksums, provenance and the SBOM are the parts most likely to be
  # misconfigured, and a tag is a one-way door — so let them run from a branch
  # first, rather than making the first real release the first time this code
  # has ever executed. The steps that write to a GitHub Release, and the
  # packaging job that reads from one, are skipped unless the ref is a tag.
  workflow_dispatch:

permissions:
  contents: read

# A tag carries the version. A rehearsal has no tag, and a branch name with a
# slash in it cannot go in a filename, so fall back to the commit.
env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run the full CI gate — format, typos, lint, tests, frontend, build,
  # vulncheck — before a single artifact is published.
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Release (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: ci
    timeout-minutes: 30
    permissions:
      contents: write
      # Build provenance is signed with a short-lived certificate issued to this
      # workflow's identity. That is the whole value: the attestation states
      # which workflow, at which commit, produced the file — something nobody
      # outside this repository can claim.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            ext: .exe
            cgo: "0"
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
            cgo: "0"
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            ext: ""
            cgo: "0"
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            ext: ""
            cgo: "1"
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ""
            cgo: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ env.VERSION }}" \
            -o dist/leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/leavesafe

      # -----------------------------------------------------------------------
      # Signing. A security tool whose install instructions are "run `xattr -d
      # com.apple.quarantine`" has taught its users to disarm the exact warning
      # that would have caught a tampered copy. Both steps below are skipped
      # when their secrets are absent, so a fork — or this repository before a
      # certificate is bought — still produces a working release rather than a
      # red run. docs/release-signing.md lists what to set.
      # -----------------------------------------------------------------------
      - name: Sign and notarize (macOS)
        if: matrix.goos == 'darwin'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          BINARY: dist/leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          set -euo pipefail

          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "No macOS signing certificate configured; leaving this build unsigned."
            {
              echo "### :warning: Unsigned macOS build"
              echo
              echo "\`${BINARY##*/}\` is unsigned, so Gatekeeper will refuse it on first run."
              echo "See \`docs/release-signing.md\` for the secrets that turn signing on."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A throwaway keychain, unlocked only for this job. Importing into the
          # login keychain would work and would also leave the key sitting in a
          # keychain this job does not own.
          KEYCHAIN="$RUNNER_TEMP/leavesafe-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign prompts for keychain access and hangs a
          # headless runner until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          # --options runtime is what notarization requires; --timestamp binds a
          # trusted time so the signature outlives the certificate.
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"

          # notarytool takes an archive, not a bare executable.
          ditto -c -k --keepParent "$BINARY" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait

          # A lone executable cannot carry a stapled ticket, so Gatekeeper looks
          # the result up online on first run. Assess it here, so a rejected
          # notarization fails the release rather than the user's first launch.
          spctl --assess --type execute --verbose=4 "$BINARY"

          security delete-keychain "$KEYCHAIN"

      - name: Sign (Windows)
        if: matrix.goos == 'windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          BINARY: dist/leavesafe-windows-amd64.exe
        run: |
          set -euo pipefail

          if [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "No Windows signing certificate configured; leaving this build unsigned."
            {
              echo "### :warning: Unsigned Windows build"
              echo
              echo "\`${BINARY##*/}\` is unsigned, so SmartScreen will warn on first run."
              echo "See \`docs/release-signing.md\` for the secrets that turn signing on."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode

          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          # The RFC 3161 timestamp is what keeps the signature valid past the
          # certificate's expiry. Without it every published binary goes
          # untrusted on the day the certificate lapses.
          osslsigncode sign \
            -pkcs12 "$RUNNER_TEMP/cert.pfx" \
            -pass "$WINDOWS_CERTIFICATE_PASSWORD" \
            -n "LeaveSafe" \
            -i "https://github.com/atakankizilyuce/LeaveSafe" \
            -ts "http://timestamp.digicert.com" \
            -h sha256 \
            -in "$BINARY" -out "$BINARY.signed"
          mv "$BINARY.signed" "$BINARY"
          rm -f "$RUNNER_TEMP/cert.pfx"
          osslsigncode verify -in "$BINARY"

      # Checksums come after signing, because signing rewrites the file: a
      # checksum taken before it would describe a binary nobody downloads.
      - name: Checksum
        shell: bash
        run: |
          cd dist
          shasum -a 256 leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            > leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256

      # A checksum only proves a file matches a number published beside it, by
      # whoever published both. This states which workflow, at which commit,
      # produced this exact file. Verify with:
      #   gh attestation verify leavesafe-linux-amd64 --repo atakankizilyuce/LeaveSafe
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            dist/leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256
          generate_release_notes: true

      # A rehearsal still has to leave something to inspect, or a green run only
      # proves the steps exited zero.
      - name: Upload as a workflow artifact (rehearsal)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v5
        with:
          name: leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            dist/leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # One SBOM for the release rather than one per platform: the Go module graph
  # is the same for every target, and five near-identical files would be five
  # things to check instead of one.
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate CycloneDX SBOM
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
            mod -json -licenses -std \
            -output leavesafe-${{ env.VERSION }}-sbom.cdx.json

      - name: Attest the SBOM
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: leavesafe-${{ env.VERSION }}-sbom.cdx.json

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: leavesafe-${{ env.VERSION }}-sbom.cdx.json

      - name: Upload as a workflow artifact (rehearsal)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v5
        with:
          name: leavesafe-sbom
          path: leavesafe-${{ env.VERSION }}-sbom.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Package manager manifests, generated from the published artifacts so their
  # checksums always describe the files that actually shipped. They are attached
  # to the release rather than pushed anywhere: publishing to a tap or to winget
  # is a decision with its own review, and doing it automatically from a tag
  # push would make every tag a publish.
  #
  # This one cannot be rehearsed: generate.sh hashes the files as published, and
  # on a branch there is no release to download them from.
  # ---------------------------------------------------------------------------
  packaging:
    name: Package manifests
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate manifests
        run: packaging/generate.sh "${{ github.ref_name }}" dist-manifests

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-manifests/*
