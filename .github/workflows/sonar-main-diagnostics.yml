name: Validate Sonar fixes

on:
  push:
    branches: [codex/fix-sonar-main-20261028]
    paths: [.github/workflows/sonar-main-diagnostics.yml]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci --ignore-scripts
        working-directory: site
      - run: web/node_modules/.bin/biome ci . --error-on-warnings
      - run: npm run typecheck
        working-directory: web
      - run: npm run coverage
        working-directory: web
      - run: npm run coverage
        working-directory: site
      - run: npm run build
        working-directory: web
      - name: Return generated bundle
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          for (const path of execFileSync('git', ['diff', '--name-only', '--', 'web/dist'], {encoding: 'utf8'}).trim().split('\n').filter(Boolean)) {
            const content = readFileSync(path, 'utf8');
            for (let offset = 0; offset < content.length; offset += 12000) {
              console.log('BUNDLE_CHUNK=' + JSON.stringify({path, offset, content: content.slice(offset, offset + 12000)}));
            }
          }
          NODE
