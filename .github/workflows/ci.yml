name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
  # Release tags run the exact same gate before anything is published.
  workflow_call:

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

# A new push to the same branch supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Formatting and spelling: platform independent, so one runner is enough.
  # ---------------------------------------------------------------------------
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted. Run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are stale. Run 'go mod tidy'."
            exit 1
          fi

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.48.0

  # ---------------------------------------------------------------------------
  # Lint runs once per target OS. Half of this codebase sits behind build tags
  # (*_windows.go, *_darwin.go, *_linux.go), and a linter only ever sees the
  # files for the platform it is analysing. darwin additionally needs cgo, so it
  # has to run on a real macOS runner rather than a cross-compile.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            runner: ubuntu-latest
          - goos: windows
            runner: windows-latest
          - goos: darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # ---------------------------------------------------------------------------
  # Tests run on every supported OS: the sensors, alarm and BLE backends are
  # entirely different implementations per platform.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # -race needs cgo, which is only guaranteed present on the Unix runners.
            race: "-race"
          - os: macos-latest
            race: "-race"
          - os: windows-latest
            race: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        shell: bash
        run: go test ./... -v ${{ matrix.race }} -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "### Coverage: $total" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage HTML report
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Layer 0: the real binary is started on every supported OS and driven through
  # the whole user journey over a real WebSocket. This is what catches "the new
  # version does not boot on macOS" before it reaches a user.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run end-to-end suite
        shell: bash
        run: go test -tags e2e ./test/e2e/... -v -count=1 -timeout 15m

  # ---------------------------------------------------------------------------
  # Layer 2: fire the hardware changes a hosted runner genuinely permits and
  # record every one it does not, so the coverage gaps end up visible in the run
  # summary rather than implied by a green check.
  # ---------------------------------------------------------------------------
  realtrigger:
    name: Real triggers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run real-trigger suite
        shell: bash
        run: go test -tags realtrigger ./test/realtrigger/... -v -count=1 -timeout 15m

  # ---------------------------------------------------------------------------
  # Layer 1: a real Ubuntu VM where real kernel modules create real hardware.
  # The charger is genuinely unplugged rather than simulated. A container cannot
  # do this, which is why the Docker support was removed rather than reused.
  # ---------------------------------------------------------------------------
  sandbox-linux:
    name: Sandbox VM (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # /dev/kvm exists on these runners but is root:kvm 0660, and the runner
      # user is not in the kvm group — so QEMU fails with "Permission denied"
      # despite the device being present. This udev rule opens it up.
      - name: Grant access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM is usable
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing; the sandbox VM cannot boot. This is a"
            echo "::error::runner capability change, not a test failure — do not paper over it."
            exit 1
          fi
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but is not readable and writable by this user,"
            echo "::error::so QEMU cannot use hardware acceleration."
            exit 1
          fi

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils

      - name: Cache the Ubuntu cloud image
        uses: actions/cache@v4
        with:
          path: test/sandbox/linuxvm/.work/base.img
          key: ubuntu-cloudimg-24.04-amd64

      - name: Run the sandbox scenarios
        run: test/sandbox/linuxvm/run.sh

      - name: Upload the VM console log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-vm-console
          path: test/sandbox/linuxvm/.work/vm-console.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Web assets: a Vite + TypeScript + Preact app in web/src, built into
  # web/dist. That build output is committed so `go build` works with no Node
  # installed — which is only safe if something proves the committed output
  # still matches the source. That is the last step here.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Biome check
        run: npx --yes @biomejs/biome@2.5.6 ci . --error-on-warnings

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Committed web/dist matches the source
        run: |
          if ! git diff --exit-code --stat -- web/dist; then
            echo "::error::web/dist is stale. Run 'npm run build' in web/ and commit the result."
            echo "The binary embeds web/dist, so a stale build ships a UI that does not"
            echo "match web/src — and nothing else would catch it."
            exit 1
          fi
          echo "web/dist is in step with web/src."

  # ---------------------------------------------------------------------------
  # Release binaries for every published target.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            ext: .exe
            cgo: "0"
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
            cgo: "0"
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            ext: ""
            cgo: "0"
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            ext: ""
            cgo: "1"
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ""
            cgo: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" \
            -o dist/leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/leavesafe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Known vulnerabilities in the Go toolchain and dependencies. gosec runs as
  # part of golangci-lint, where it can be scoped per path.
  # ---------------------------------------------------------------------------
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection. Fails if any job above
  # failed or was skipped, so a new job cannot be silently left out.
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [format, typos, lint, test, e2e, realtrigger, sandbox-linux, frontend, build, vulncheck]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::At least one CI job did not succeed."
          exit 1

      - name: All checks passed
        run: echo "All CI jobs succeeded."
