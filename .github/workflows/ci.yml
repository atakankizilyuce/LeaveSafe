name: CI

# Every `uses:` is pinned to a commit SHA, with the version it was at in a
# trailing comment. A tag is a moving pointer that the action's owner can
# repoint at any time; the SHA is the code that was reviewed. Dependabot reads
# the comment and bumps both together, so pinning costs nothing to maintain.
# Keep it that way — replacing a SHA with a tag is a downgrade, not a tidy-up.

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
  # Release tags run the exact same gate before anything is published.
  workflow_call:

# Least privilege by default; no job here needs write access. Every job below
# then states its own permissions as well, which is what actually scopes the
# token — this block only decides what a job that forgets to would inherit.
permissions:
  contents: read

# A new push to the same branch supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Formatting and spelling: platform independent, so one runner is enough.
  # ---------------------------------------------------------------------------
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted. Run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are stale. Run 'go mod tidy'."
            exit 1
          fi

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  # ---------------------------------------------------------------------------
  # Lint runs once per target OS. Half of this codebase sits behind build tags
  # (*_windows.go, *_darwin.go, *_linux.go), and a linter only ever sees the
  # files for the platform it is analysing. darwin additionally needs cgo, so it
  # has to run on a real macOS runner rather than a cross-compile.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            runner: ubuntu-latest
          - goos: windows
            runner: windows-latest
          - goos: darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  # ---------------------------------------------------------------------------
  # Tests run on every supported OS: the sensors, alarm and BLE backends are
  # entirely different implementations per platform.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # -race needs cgo, which is only guaranteed present on the Unix runners.
            race: "-race"
            label: linux
          - os: macos-latest
            race: "-race"
            label: macos
          - os: windows-latest
            race: ""
            label: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests
        shell: bash
        run: go test ./... -v ${{ matrix.race }} -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "### Coverage (linux leg only): $total" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage HTML report
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -html=coverage.out -o coverage.html

      # Every leg produces a profile, but only for the files its GOOS compiles.
      # Naming them apart is what lets the sonar job download all three side by
      # side; left as coverage.out they would overwrite one another.
      - name: Name the profile after the platform that produced it
        shell: bash
        run: mv coverage.out coverage-${{ matrix.label }}.out

      - name: Upload the coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-${{ matrix.label }}
          path: coverage-${{ matrix.label }}.out
          retention-days: 14

      # The HTML report is for whoever is reading the run, and it is kept in its
      # own artifact so that the sonar job never downloads it. Analysing it fails
      # the quality gate on its own — see the coverage.html note in
      # sonar-project.properties.
      - name: Upload the coverage HTML report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-html
          path: coverage.html
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Layer 0: the real binary is started on every supported OS and driven through
  # the whole user journey over a real WebSocket. This is what catches "the new
  # version does not boot on macOS" before it reaches a user.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run end-to-end suite
        shell: bash
        run: go test -tags e2e ./test/e2e/... -v -count=1 -timeout 15m

  # ---------------------------------------------------------------------------
  # Layer 2: fire the hardware changes a hosted runner genuinely permits and
  # record every one it does not, so the coverage gaps end up visible in the run
  # summary rather than implied by a green check.
  # ---------------------------------------------------------------------------
  realtrigger:
    name: Real triggers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run real-trigger suite
        shell: bash
        run: go test -tags realtrigger ./test/realtrigger/... -v -count=1 -timeout 15m

  # ---------------------------------------------------------------------------
  # Layer 1: a real Ubuntu VM where real kernel modules create real hardware.
  # The charger is genuinely unplugged rather than simulated. A container cannot
  # do this, which is why the Docker support was removed rather than reused.
  # ---------------------------------------------------------------------------
  sandbox-linux:
    name: Sandbox VM (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # /dev/kvm exists on these runners but is root:kvm 0660, and the runner
      # user is not in the kvm group — so QEMU fails with "Permission denied"
      # despite the device being present. This udev rule opens it up.
      - name: Grant access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM is usable
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing; the sandbox VM cannot boot. This is a"
            echo "::error::runner capability change, not a test failure — do not paper over it."
            exit 1
          fi
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but is not readable and writable by this user,"
            echo "::error::so QEMU cannot use hardware acceleration."
            exit 1
          fi

      # A runner whose apt-daily timer is midway through its own upgrade pass
      # holds the dpkg lock, and apt waits for that lock with no deadline. One
      # run sat here for 23 minutes while three concurrent jobs installed the
      # same packages in 20 seconds each, and only cleared with 5 minutes left
      # of the job timeout — so this was minutes away from failing the whole
      # run with a log that explained nothing. Stopping the timers removes the
      # contention, -q rather than -qq keeps apt's lock-wait lines in the log
      # if it happens again, and the deadlines turn a poisoned runner into a
      # quick retry instead of a silent hang that eats the entire job budget.
      - name: Install QEMU and cloud-image tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service || true

          for attempt in 1 2; do
            if sudo -E timeout 120 apt-get update -q \
              && sudo -E timeout 300 apt-get install -y -q \
                qemu-system-x86 qemu-utils cloud-image-utils; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt stalled or failed; the runner's"
            echo "::warning::package state is being repaired before the next try."
            sudo dpkg --configure -a || true
          done

          echo "::error::apt could not install the QEMU tooling in two attempts."
          echo "::error::This is a runner or mirror problem, not a test failure."
          exit 1

      - name: Cache the Ubuntu cloud image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/sandbox/linuxvm/.work/base.img
          key: ubuntu-cloudimg-24.04-amd64

      - name: Run the sandbox scenarios
        run: test/sandbox/linuxvm/run.sh

      - name: Upload the VM console log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sandbox-vm-console
          path: test/sandbox/linuxvm/.work/vm-console.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Web assets: a Vite + TypeScript + Preact app in web/src, built into
  # web/dist. That build output is committed so `go build` works with no Node
  # installed — which is only safe if something proves the committed output
  # still matches the source. That is the last step here.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json

      # --ignore-scripts means a dependency cannot run code on this runner just
      # by being installed. esbuild is the only package here that ships an
      # install script, and it does not need one: the platform binary arrives as
      # an optional dependency and its launcher finds it at run time.
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # The landing page has no build and no runtime dependencies. These are
      # vitest and jsdom, so the demonstration in its hero can be tested.
      - name: Install the landing page's test dependencies
        working-directory: site
        run: npm ci --ignore-scripts

      # Biome is a devDependency rather than an `npx` download, so its version
      # comes from the lock file along with everything else. Run from the
      # repository root, because that is where biome.json is and its paths are
      # written relative to it.
      - name: Biome check
        run: web/node_modules/.bin/biome ci . --error-on-warnings

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run coverage

      # vitest names each file relative to web/, because that is where it runs.
      # SonarQube reads the report from the repository root, where a bare
      # public/sw.js exists nowhere. Prefixing here keeps the test command the
      # same whether a person or CI runs it.
      - name: Point the coverage report at the repository root
        run: sed -i 's|^SF:|SF:web/|' web/coverage/lcov.info

      - name: Upload the phone interface's coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          retention-days: 14

      - name: Test the landing page
        working-directory: site
        run: npm run coverage

      - name: Point that report at the repository root too
        run: sed -i 's|^SF:|SF:site/|' site/coverage/lcov.info

      - name: Upload the landing page's coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-coverage
          path: site/coverage/lcov.info
          retention-days: 14

      - name: Build
        working-directory: web
        run: npm run build

      - name: Committed web/dist matches the source
        run: |
          if ! git diff --exit-code --stat -- web/dist; then
            echo "::error::web/dist is stale. Run 'npm run build' in web/ and commit the result."
            echo "The binary embeds web/dist, so a stale build ships a UI that does not"
            echo "match web/src — and nothing else would catch it."
            exit 1
          fi
          echo "web/dist is in step with web/src."

  # ---------------------------------------------------------------------------
  # Release binaries for every published target.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            ext: .exe
            cgo: "0"
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
            cgo: "0"
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            ext: ""
            cgo: "0"
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            ext: ""
            cgo: "1"
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ""
            cgo: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # A Go binary carries no Windows version resource unless one is linked
      # into it, and an executable that names no company, product or purpose is
      # what an antivirus machine-learning model scores worst — Defender's
      # verdict on an anonymous unsigned file is about the anonymity, not about
      # anything this program does. This compiles winres/winres.json into an
      # object `go build` picks up on its own, because of the _windows_amd64
      # suffix the tool puts on the name. Building it here as well as in the
      # release means a broken resource fails on the pull request that broke it
      # rather than on a tag.
      - name: Windows resources
        if: matrix.goos == 'windows'
        run: |
          go tool go-winres make \
            --in winres/winres.json \
            --arch ${{ matrix.goarch }} \
            --out cmd/leavesafe/rsrc

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" \
            -o dist/leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/leavesafe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: leavesafe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Known vulnerabilities in the Go toolchain and dependencies. gosec runs as
  # part of golangci-lint, where it can be scoped per path.
  # ---------------------------------------------------------------------------
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # govulncheck is a tool dependency in go.mod rather than a `go install` of
      # a version tag. `go install pkg@version` ignores this module entirely and
      # resolves the scanner's own dependencies fresh on every run, so the thing
      # auditing our supply chain had an unaudited one of its own. As a tool
      # dependency its whole graph is pinned in go.sum and Dependabot bumps it
      # like any other.
      - name: govulncheck
        run: go tool govulncheck ./...

  # ---------------------------------------------------------------------------
  # Code quality. Each leg of the test matrix already produces a coverage profile
  # for the files its own GOOS compiles; this job merges all three and hands the
  # result to SonarQube Cloud, which reports a quality gate on the pull request.
  # Reading only the Linux profile would leave every _darwin.go and _windows.go
  # file counted as uncovered, tests or no tests.
  #
  # This job is deliberately absent from ci-success's needs list below. It cannot
  # run without SONAR_TOKEN, a pull request opened from a fork never receives
  # secrets, and ci-success counts a skipped job as a failure — wiring it in
  # would permanently block every outside contribution.
  # ---------------------------------------------------------------------------
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [test, frontend]
    # Forks have no secrets. Dependabot's runs read from a separate secret store,
    # so drop the second clause once SONAR_TOKEN is added there too.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Sonar attributes each issue to whoever wrote the line, which it reads
          # from git blame. The default shallow checkout has no blame to read.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Fetch every platform's coverage profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-report-*
          merge-multiple: true

      - name: Merge the three profiles into the one Sonar reads
        shell: bash
        run: |
          # Each leg only compiled its own GOOS, so a platform file appears in
          # exactly one profile while portable files appear in all three with
          # identical block boundaries. Summing the counters per block is
          # therefore a plain union, and it is what `go tool cover` already does
          # with the duplicate blocks `go test` emits per test binary.
          #
          # Sonar accepts several report paths, but whether it unions or
          # overwrites a file present in more than one of them is undocumented,
          # and guessing wrong would silently lower every portable file. Merging
          # here keeps that decision in the repository.
          {
            echo "mode: atomic"
            awk 'FNR > 1 {
                   key = $1 " " $2
                   count[key] += $3
                   if (!(key in seen)) { seen[key]; order[++n] = key }
                 }
                 END { for (i = 1; i <= n; i++) print order[i], count[order[i]] }' \
              coverage-linux.out coverage-macos.out coverage-windows.out
          } > coverage.out

          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "### Coverage across all three platforms: $total" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the phone interface's coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-coverage
          path: web/coverage

      - name: Fetch the landing page's coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-coverage
          path: site/coverage

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection. Fails if any job above
  # failed or was skipped, so a new job cannot be silently left out.
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job reads the other jobs' results, never the repository.
    permissions: {}
    needs: [format, typos, lint, test, e2e, realtrigger, sandbox-linux, frontend, build, vulncheck]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::At least one CI job did not succeed."
          exit 1

      - name: All checks passed
        run: echo "All CI jobs succeeded."
