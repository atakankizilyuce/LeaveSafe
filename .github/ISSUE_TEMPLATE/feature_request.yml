name: Feature request
description: Something LeaveSafe should be able to do.
labels: ["enhancement"]
assignees: ["atakankizilyuce"]
body:
  - type: markdown
    attributes:
      value: |
        LeaveSafe has a deliberately narrow shape: no account, no server, no
        internet needed, nothing uploaded anywhere. A proposal that fits inside
        that has a much better chance than one that does not — and if yours
        needs to break it, say why the trade is worth making.

  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: >-
        The situation you are in, not the feature you have in mind. What are you
        doing, and where does LeaveSafe leave you stuck?
      placeholder: >-
        I work in a shared office and leave my laptop for an hour at a time. When
        someone bumps the table I get an alert I do not need, and after a few of
        those I stop trusting them.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
      description: Your idea for solving it, in as much or as little detail as you have.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried
      description: >-
        Existing settings that nearly work, or other approaches you considered.
        Knowing what does not quite fit is often more useful than the proposal.

  - type: dropdown
    id: area
    attributes:
      label: Which part of LeaveSafe
      multiple: true
      options:
        - Sensors and detection
        - Alarm and escalation
        - Phone interface
        - Pairing and connection
        - Location
        - Terminal dashboard
        - Packaging and installation
        - Something else

  - type: checkboxes
    id: constraints
    attributes:
      label: Does it fit the shape of the project
      description: >-
        Tick what holds. An unticked box is not a rejection — it just means the
        proposal needs an argument for the trade.
      options:
        - label: It works with no account and no server.
        - label: It works with no internet connection.
        - label: It uploads nothing to anyone.
        - label: It does not require the user to trust a third party.
