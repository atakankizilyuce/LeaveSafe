[files]
extend-exclude = [
  "go.sum",
  "dist/",
  # The specs and plans are working notes, written in Turkish. An English
  # spell checker reading them is only ever going to be wrong: "blok" is the
  # Turkish word, not a misspelling of "block", and "'nin" is a suffix rather
  # than a word at all. They describe how the code was arrived at and are not
  # shipped to anybody, so there is nothing here for a typo to break.
  "docs/superpowers/",
]

# Long runs of base64url are keys and ciphertext, not prose. RFC 8291's worked
# example is checked byte for byte, so a "correction" to one character of it
# would be a silent change to what this program proves about itself — and a
# spell checker reading a key as English is only ever going to be wrong.
[default]
extend-ignore-re = ["[A-Za-z0-9_-]{40,}"]

# Identifiers from third-party APIs keep their vendor spelling.
[default.extend-identifiers]
AttributePermissionsWriteable = "AttributePermissionsWriteable"

[default.extend-words]
# "UPnP" splits into U/Pn/P, and "Pn" reads as a typo for "On".
Pn = "Pn"
# schtasks spells its output-format flag "/fo", which reads as a typo for "of".
fo = "fo"
