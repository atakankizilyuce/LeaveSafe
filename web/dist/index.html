<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="theme-color" content="#070b12" />
        <meta name="color-scheme" content="dark" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="description" content="Arm your laptop from your phone." />
        <!--
            Installing this to the home screen is not a nicety here. A page kept
            open in a tab is a page the phone is free to discard, and a
            discarded page is one that is not there when the alarm fires. The
            manifest is what lets it be installed, and what makes notification
            permission survive being closed.
        -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="LeaveSafe" />
        <meta name="application-name" content="LeaveSafe" />
        <!-- Inline so the icon costs no request and works with no network. -->
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23070b12'/%3E%3Cpath d='M12 4.2 6.4 6.3v4.6c0 3.5 2.3 6.6 5.6 8 3.3-1.4 5.6-4.5 5.6-8V6.3z' fill='none' stroke='%236c8cff' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E"
        />
        <title>LeaveSafe</title>
      <script type="module" crossorigin src="/app.js"></script>
      <link rel="stylesheet" crossorigin href="/app.css">
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
